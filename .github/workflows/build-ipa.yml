name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - "build-errors.txt"

permissions:
  contents: write

jobs:
  build:
    # macos-14 镜像已退役（报错 'macos-14-arm64-us-default' is not supported）
    # 用 macos-latest；如需固定可改为 macos-15
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SuperViewer.xcodeproj \
            -scheme SuperViewer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SuperViewer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build_full.log

      - name: Show compile errors
        if: failure()
        run: |
          echo "========== ALL ERRORS =========="
          grep -h "error:" build_full.log | sort -u | head -80 || echo "(no error: lines found)"
          echo "========== END =========="

      # 失败时把错误日志自动提交回仓库, 方便远程诊断 (commit 带 [skip ci] 防死循环)
      - name: Commit error log back
        if: failure()
        run: |
          { echo "=== build errors (unique) ==="
            grep -h "error:" build_full.log | sort -u || true
            echo ""
            echo "=== log tail ==="
            tail -50 build_full.log
          } > build-errors.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@local"
          git add build-errors.txt
          git commit -m "ci: build errors [skip ci]" || true
          git push || true

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/SuperViewer.xcarchive/Products/Applications/SuperViewer.app" build/Payload/
          cd build
          zip -qry SuperViewer-unsigned.ipa Payload
          ls -lh SuperViewer-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperViewer-unsigned-ipa
          path: build/SuperViewer-unsigned.ipa
          retention-days: 30
